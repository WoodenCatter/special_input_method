<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>斗地主 Online · Dou Dizhu</title>
<meta name="description" content="Dou Dizhu (Fight the Landlord) — play online with friends, peer-to-peer, no signup.">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#123f27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="斗地主">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toast-wrap"></div>

<!-- ===================== HOME ===================== -->
<section id="screen-home" class="screen">
  <header class="home-head">
    <h1 id="t-title">斗地主 Online</h1>
    <p id="t-subtitle" class="muted"></p>
    <div class="head-btns">
      <button id="btn-bgm" class="ghost small">🎵</button>
      <button id="btn-snd" class="ghost small">🔊</button>
      <button id="btn-lang" class="ghost small">EN</button>
      <button id="btn-help" class="ghost small"></button>
    </div>
  </header>

  <div class="panel">
    <label class="field-label" id="t-name"></label>
    <input id="inp-name" maxlength="12" autocomplete="off">

    <label class="field-label" id="t-mode"></label>
    <div class="mode-grid">
      <label class="mode-card"><input type="radio" name="mode" value="classic" checked>
        <span class="mc-title" id="t-mclassic"></span><span class="mc-desc" id="t-mclassic-d"></span></label>
      <label class="mode-card"><input type="radio" name="mode" value="duel">
        <span class="mc-title" id="t-mduel"></span><span class="mc-desc" id="t-mduel-d"></span></label>
      <label class="mode-card hidden"><input type="radio" name="mode" value="team">
        <span class="mc-title" id="t-mteam"></span><span class="mc-desc" id="t-mteam-d"></span></label>
    </div>

    <label class="field-label" id="t-options"></label>
    <div class="opt-grid">
      <label class="opt"><input type="checkbox" id="opt-laizi">
        <span><b id="t-olaizi"></b><i id="t-olaizi-d"></i></span></label>
      <label class="opt"><input type="checkbox" id="opt-noshuffle">
        <span><b id="t-onoshuffle"></b><i id="t-onoshuffle-d"></i></span></label>
      <label class="opt"><input type="checkbox" id="opt-doubling" checked>
        <span><b id="t-odoubling"></b><i id="t-odoubling-d"></i></span></label>
      <label class="opt opt-base"><span><b id="t-obase"></b></span>
        <select id="sel-base"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></label>
    </div>

    <div class="big-btns">
      <button id="btn-create" class="primary"><b id="t-bcreate"></b><i id="t-bcreate-d"></i></button>
      <button id="btn-practice"><b id="t-bpractice"></b><i id="t-bpractice-d"></i></button>
    </div>
  </div>

  <div class="panel join-panel">
    <label class="field-label" id="t-join"></label>
    <div class="join-row">
      <input id="inp-code" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button id="btn-join" class="primary"></button>
    </div>
    <button id="btn-diag" class="ghost small diag-btn"></button>
    <div id="diag-out"></div>
  </div>
</section>

<!-- ===================== ROOM (waiting) ===================== -->
<section id="screen-room" class="screen">
  <div class="panel room-panel">
    <p class="muted" id="t-rcode"></p>
    <div class="code-row"><span id="room-code" class="code"></span><button id="btn-copy" class="ghost small"></button></div>
    <p class="muted" id="room-status"></p>
    <div id="room-players"></div>
    <div class="big-btns">
      <button id="btn-start" class="primary"></button>
      <button id="btn-leave-room"></button>
    </div>
  </div>
</section>

<!-- ===================== GAME ===================== -->
<section id="screen-game" class="screen">
  <div id="table">
    <div id="table-top">
      <div id="center-info"></div>
      <div class="top-right-btns">
        <button id="btn-settings" class="settings-trigger" type="button">⚙ 游戏设置</button>
      </div>
    </div>
    <div id="opp-row">
      <div id="opp-left" class="opp-zone"></div>
      <div id="table-mid"></div>
      <div id="opp-right" class="opp-zone"></div>
    </div>
    <div id="my-zone">
      <div id="my-lastplay"></div>
      <div id="bci-scan-zone" class="bci-scan-zone" aria-live="polite">
        <div class="bci-scan-status">
          <strong id="bci-phase">等待开始</strong>
          <span id="bci-direction">默认向右轮转</span>
        </div>
        <div id="bci-candidates" class="bci-candidates"></div>
      </div>
      <div id="actions"></div>
      <div id="my-hand"></div>
      <div id="my-bar">
        <div id="my-info"></div>
        <div id="chat-bar"><button id="btn-chat" class="ghost small">💬</button></div>
      </div>
    </div>
  </div>
  <div id="chat-pop" class="hidden"></div>
  <div id="settle-overlay" class="hidden"></div>
</section>

<!-- APP 单机版设置：打开和关闭不会清除玩家当前选中的牌。 -->
<div id="settings-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-box">
    <h2 id="settings-title">游戏设置</h2>
    <button id="btn-return-selection" class="settings-action return" type="button">
      <strong>返回选择</strong>
      <span>关闭设置，继续刚才的选牌或出牌</span>
    </button>
    <button id="btn-sound-toggle" class="settings-action sound" type="button">
      <strong id="settings-sound-label">声音：开</strong>
      <span>同时控制背景音乐和游戏音效</span>
    </button>
    <button id="btn-confirm-toggle" class="settings-action confirm-setting" type="button">
      <strong id="settings-confirm-label">二次确认：开</strong>
      <span>关闭后，出牌、不出、重新开始和退出都会立即执行</span>
    </button>
    <button id="btn-restart-game" class="settings-action restart" type="button">
      <strong>重新开始</strong>
      <span>重新发牌并清空本次积分</span>
    </button>
    <button id="btn-app-exit" class="settings-action exit" type="button">
      <strong>退出斗地主</strong>
      <span>返回康复 APP 首页</span>
    </button>
  </div>
</div>

<div id="bci-confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="bci-confirm-title">
  <div class="bci-confirm-box">
    <h2 id="bci-confirm-title">确定要出牌吗？</h2>
    <div id="bci-confirm-cards" class="bci-confirm-cards"></div>
    <div class="bci-confirm-options">
      <button id="btn-bci-confirm" class="confirm" type="button">确定</button>
      <button id="btn-bci-cancel" class="cancel" type="button">返回选择</button>
    </div>
  </div>
</div>

<!-- ===================== HELP ===================== -->
<div id="help-modal" class="hidden">
  <div class="help-box">
    <div class="help-head"><h2 id="t-help-title"></h2><button id="btn-help-close" class="ghost small">✕</button></div>
    <div id="help-body"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/sound.js"></script>
<script src="js/music.js"></script>
<script src="js/cards.js"></script>
<script src="js/moves.js"></script>
<script src="js/ai.js"></script>
<script src="js/bci.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
